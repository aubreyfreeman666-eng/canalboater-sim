*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1020;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#f3eedf;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#hud{position:fixed;inset:0;pointer-events:none;padding:var(--sat) var(--sar) var(--sab) var(--sal)}
#hud>*{pointer-events:auto}
.panel{background:linear-gradient(180deg,rgba(22,32,30,.62),rgba(12,18,17,.7));backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2);border:1px solid rgba(255,255,255,.14);border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.08)}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 85% 75% at 50% 45%,rgba(0,0,0,0) 60%,rgba(10,8,4,.32) 100%)}
#top{position:absolute;top:calc(var(--sat) + 6px);left:8px;right:8px;display:flex;gap:6px;justify-content:space-between;pointer-events:none}
#loc{padding:6px 10px;min-width:0;flex:1 1 auto;pointer-events:auto}
#loc b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#f6dc8a}
#loc span{display:block;font-size:11px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stats{padding:6px 10px;text-align:right;font-size:12px;flex:0 0 auto;pointer-events:auto}
#stats b#money{font-size:14px;color:#9fe0a0;display:block;margin-top:1px}
#stats #wx{display:block}
#clk{display:flex;align-items:baseline;justify-content:flex-end;gap:6px;line-height:1}
#clk b{font-size:25px;font-weight:800;color:#fff;letter-spacing:.5px;font-variant-numeric:tabular-nums;text-shadow:0 1px 3px rgba(0,0,0,.5)}
#clk span{font-size:11.5px;opacity:.9;white-space:nowrap}
#chips{position:absolute;top:calc(var(--sat) + 70px);left:8px;right:62px;display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;padding:3px 8px;border-radius:999px;background:rgba(14,22,20,.58);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);white-space:nowrap;letter-spacing:.1px}
.chip.spd{background:rgba(32,74,50,.9);font-weight:700}
.chip.bad{background:rgba(150,30,30,.85);border-color:#ff8a7a}
.chip.warn{background:rgba(150,100,20,.85);border-color:#f6c35c}
#side{position:absolute;right:8px;top:calc(var(--sat) + 70px);display:flex;flex-direction:column;gap:8px}
.rb{width:46px;height:46px;border-radius:50%;font-size:21px;display:flex;align-items:center;justify-content:center}
#speed{position:absolute;left:10px;bottom:calc(var(--sab) + 222px);font-size:12px;padding:4px 8px}
#thr{position:absolute;left:10px;bottom:calc(var(--sab) + 14px);width:74px;height:200px;padding:8px}
#thr .track{position:relative;width:100%;height:100%;border-radius:10px;background:linear-gradient(#2c5a35,#1f2a24 46%,#1f2a24 54%,#5a2c2c);touch-action:none}
#thr .knob{position:absolute;left:4px;right:4px;height:30px;margin-top:-15px;border-radius:8px;background:linear-gradient(#e9d28a,#b8963e);box-shadow:0 2px 6px rgba(0,0,0,.5);pointer-events:none;display:flex;align-items:center;justify-content:center;color:#2a2210;font-weight:700;font-size:12px}
#thr .lbl{position:absolute;right:-2px;font-size:10px;opacity:.7;pointer-events:none;transform:translateX(100%)}
#thr .notch{position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(255,255,255,.35);pointer-events:none}
#til{position:absolute;right:10px;bottom:calc(var(--sab) + 14px);width:210px;height:86px;padding:8px}
#til .track{position:relative;width:100%;height:100%;border-radius:10px;background:linear-gradient(90deg,#2a3a4a,#1f2a24 45%,#1f2a24 55%,#2a3a4a);touch-action:none;overflow:hidden}
#til .arm{position:absolute;left:50%;bottom:6px;width:8px;height:58px;margin-left:-4px;border-radius:4px;background:linear-gradient(#e9d28a,#b8963e);transform-origin:50% 100%;pointer-events:none}
#til .arm i{position:absolute;left:50%;top:-4px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#d4a640;box-shadow:0 0 0 2px #6b5220}
#til .bow{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:11px;font-weight:600;color:#cfe;opacity:.75;pointer-events:none;text-shadow:0 1px 2px #000}
#til .bow.l,#til .bow.r{color:#ffd76a;opacity:1;font-size:12px}
#til .cap{position:absolute;left:4px;right:4px;top:3px;font-size:10px;opacity:.7;display:flex;justify-content:space-between;pointer-events:none}
#ctx{position:absolute;left:8px;right:8px;bottom:calc(var(--sab) + 226px);display:flex;flex-wrap:wrap-reverse;gap:6px;justify-content:center;align-content:flex-start}
.cb{padding:7px 10px;border-radius:11px;font-size:12.5px;font-weight:600;background:rgba(32,74,50,.92);border:1px solid rgba(246,220,138,.5);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.cb:active,.btn:active,.rb:active{transform:scale(.96)}
#toasts{position:absolute;left:8px;right:62px;top:calc(var(--sat) + 124px);max-width:520px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{padding:8px 12px;border-radius:10px;font-size:13px;background:rgba(18,28,24,.9);border-left:4px solid #8ab;animation:tin .25s ease-out;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.toast.good{border-color:#6c6}.toast.bad{border-color:#e55}.toast.warn{border-color:#eb5}.toast.info{border-color:#7ad}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
#busy{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 232px);width:240px;padding:6px 10px;font-size:12px;text-align:center}
#busy .bar{height:6px;border-radius:3px;background:#333;margin-top:4px;overflow:hidden}#busy .bar i{display:block;height:100%;width:0;background:#e6c35c}
#lock{position:absolute;left:8px;right:8px;top:calc(var(--sat) + 118px);padding:8px 10px;max-height:calc(100vh - 390px);overflow:auto}
#lock h3{margin:0 0 4px;font-size:14px;color:#f6dc8a;display:flex;align-items:center;gap:6px}#lock h3 span{flex:1}
#lock h3 button{background:rgba(255,255,255,.1);border-radius:8px;padding:4px 9px;min-height:36px}
#lock h3 button.lx{width:42px;height:42px;font-size:20px;background:#5a2f2f;border:1px solid rgba(255,255,255,.25)}
.diag{display:flex;align-items:flex-end;height:66px;gap:2px;margin:4px 0 8px;background:linear-gradient(#3a5530,#2d4426);border-radius:8px;padding:0 4px}
.dcol{position:relative;flex:1;height:100%}.dcol.ch{flex:1.6}
.dcol .wt{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#5fa0c8,#3a6f8f);border-radius:3px 3px 0 0;transition:height .2s}
.dcol small{position:absolute;left:0;right:0;top:2px;text-align:center;font-size:9px;opacity:.85}
